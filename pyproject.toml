[project]
name = "cvelio"
version = "0.2.0"
description = "Turn one profile into a resume aimed at each job posting, typeset with LaTeX."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
dependencies = ["pypdf>=5", "pyyaml>=6"]

[project.scripts]
cvelio = "cvelio.cli:main"

[project.urls]
Repository = "https://github.com/socketsguru/cvelio"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvelio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
